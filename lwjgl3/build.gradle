buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath "io.github.fourlastor:construo:1.7.1"
  }
}
plugins {
  id "application"
}
apply plugin: 'io.github.fourlastor.construo'

import io.github.fourlastor.construo.Target

sourceSets.main.java.srcDirs = ['src']
sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
mainClassName = 'lwjgl3.Lwjgl3Launcher'
application.setMainClass(mainClassName)
eclipse.project.name = appName + '-lwjgl3'
java.sourceCompatibility = 21
java.targetCompatibility = 21
if (JavaVersion.current().isJava9Compatible()) {
    compileJava.options.release.set(21)
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

dependencies {
  implementation platform("org.lwjgl:lwjgl-bom:3.3.4")
  implementation "org.lwjgl:lwjgl"
  implementation "org.lwjgl:lwjgl-glfw"
  implementation "org.lwjgl:lwjgl-opengl"
  implementation 'it.unimi.dsi:fastutil-core:8.5.15'
  runtimeOnly "org.lwjgl:lwjgl::natives-windows"
  runtimeOnly "org.lwjgl:lwjgl-glfw::natives-windows"
  runtimeOnly "org.lwjgl:lwjgl-opengl::natives-windows"
  runtimeOnly "org.lwjgl:lwjgl::natives-linux"
  runtimeOnly "org.lwjgl:lwjgl-glfw::natives-linux"
  runtimeOnly "org.lwjgl:lwjgl-opengl::natives-linux"
  runtimeOnly "org.lwjgl:lwjgl::natives-macos"
  runtimeOnly "org.lwjgl:lwjgl-glfw::natives-macos"
  runtimeOnly "org.lwjgl:lwjgl-opengl::natives-macos"

  implementation 'com.google.code.gson:gson:2.10.1'

  implementation project(':core')
}

def os = System.properties['os.name'].toLowerCase()
def logDirectory = rootProject.file('logs')
def gameJvmArgs = [
  "-XX:ErrorFile=${logDirectory}/AdventureRPG_%p.log".toString(),
  "-Dadventurerpg.logDirectory=${logDirectory}".toString()
]
if (os.contains('mac')) gameJvmArgs += '-XstartOnFirstThread'
def editorJvmArgs = ['-XX:+UseSerialGC', '-XX:CICompilerCount=2'] + gameJvmArgs

run {
  workingDir = rootProject.file('assets').path
  jvmArgs += gameJvmArgs
}

tasks.create('runEditor', JavaExec) {
  workingDir = rootProject.file('assets').path
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'lwjgl3.Lwjgl3LauncherEditor'
  jvmArgs += editorJvmArgs
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

// Starts the game or editor in its own process with no console attached. The
// windowed javaw launcher is used where the JDK ships one (Windows); output is
// discarded because the engine writes everything to its session log instead.
def launchWithoutConsole = { String launchMainClass, List<String> launchJvmArgs ->
  File javaExecutable = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }.get().executablePath.asFile
  File windowedExecutable = new File(javaExecutable.parentFile, 'javaw.exe')
  List<String> command = [(windowedExecutable.exists() ? windowedExecutable : javaExecutable).path]
  command += launchJvmArgs
  command += ['-cp', sourceSets.main.runtimeClasspath.asPath, launchMainClass]
  new ProcessBuilder(command)
    .directory(rootProject.file('assets'))
    .redirectOutput(ProcessBuilder.Redirect.DISCARD)
    .redirectError(ProcessBuilder.Redirect.DISCARD)
    .start()
}

tasks.register('launch') {
  group = 'application'
  description = 'Starts the game with no console window.'
  dependsOn sourceSets.main.runtimeClasspath
  doLast {
    launchWithoutConsole('lwjgl3.Lwjgl3Launcher', gameJvmArgs)
  }
}

tasks.register('launchEditor') {
  group = 'application'
  description = 'Starts the editor with no console window.'
  dependsOn sourceSets.main.runtimeClasspath
  doLast {
    launchWithoutConsole('lwjgl3.Lwjgl3LauncherEditor', editorJvmArgs)
  }
}

jar {
  archiveFileName.set("${appName}-${projectVersion}.jar")
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
  manifest {
    attributes 'Main-Class': project.mainClassName
  }
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

tasks.create("jarMac") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-mac.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dll", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

tasks.create("jarLinux") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-linux.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**", "**/*.dll", "**/*.dylib",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

tasks.create("jarWin") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-win.jar")
  jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dylib", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

construo {
    name.set(appName)
    humanName.set(appName)
    version.set("$projectVersion")

    targets.configure {
      create("linuxX64", Target.Linux) {
        architecture.set(Target.Architecture.X86_64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_linux_hotspot_17.0.15_6.tar.gz")
      }
      create("macM1", Target.MacOs) {
        architecture.set(Target.Architecture.AARCH64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.15_6.tar.gz")
        identifier.set("com.AdventureRPG." + appName)
        macIcon.set(project.file("icons/logo.icns"))
      }
      create("macX64", Target.MacOs) {
        architecture.set(Target.Architecture.X86_64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_mac_hotspot_17.0.15_6.tar.gz")
        identifier.set("com.AdventureRPG." + appName)
        macIcon.set(project.file("icons/logo.icns"))
      }
      create("winX64", Target.Windows) {
        architecture.set(Target.Architecture.X86_64)
        icon.set(project.file("icons/logo.png"))
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_windows_hotspot_17.0.15_6.zip")
      }
    }
}

tasks.create('dist') {
  dependsOn 'jar'
}

distributions {
  main {
    contents {
      into('libs') {
        project.configurations.runtimeClasspath.files.findAll { file ->
          file.getName() != project.tasks.jar.outputs.files.singleFile.name
        }.each { file ->
          exclude file.name
        }
      }
    }
  }
}

startScripts.dependsOn(':lwjgl3:jar')
startScripts.classpath = project.tasks.jar.outputs.files